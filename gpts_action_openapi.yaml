openapi: 3.1.0
info:
  title: Pokemon Champions Calculator API
  version: 1.0.0
  description: Calculator API for Pokemon Champions damage, speed, and speed comparison.
servers:
  - url: https://pkm-calculator-loyang-s-projects.vercel.app
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the calculator API is available.
      responses:
        '200':
          description: Calculator service status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /damage:
    post:
      operationId: calculateDamage
      summary: Calculate Pokemon Champions damage rolls and KO chance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attacker
                - defender
                - move
              properties:
                attacker:
                  type: object
                  description: Attacking Pokemon set.
                  properties:
                    species:
                      type: string
                    ability:
                      type: string
                    item:
                      type: string
                    status:
                      type: string
                    teraType:
                      type: string
                    currentHp:
                      type: number
                    currentHpPercent:
                      type: number
                    statPoints:
                      type: object
                      properties:
                        hp:
                          type: integer
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    alignment:
                      type: string
                    boosts:
                      type: object
                      properties:
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    unburdenActive:
                      type: boolean
                defender:
                  type: object
                  description: Defending Pokemon set.
                  properties:
                    species:
                      type: string
                    ability:
                      type: string
                    item:
                      type: string
                    status:
                      type: string
                    teraType:
                      type: string
                    currentHp:
                      type: number
                    currentHpPercent:
                      type: number
                    statPoints:
                      type: object
                      properties:
                        hp:
                          type: integer
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    alignment:
                      type: string
                    boosts:
                      type: object
                      properties:
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    unburdenActive:
                      type: boolean
                move:
                  type: object
                  description: Move input.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    isCrit:
                      type: boolean
                    includeCritical:
                      type: boolean
                    critStage:
                      type: integer
                    alwaysCrit:
                      type: boolean
                    hits:
                      type: integer
                    useZ:
                      type: boolean
                    accuracy:
                      type: number
                field:
                  type: object
                  description: Battle field state.
                  properties:
                    gameType:
                      type: string
                    weather:
                      type: string
                    terrain:
                      type: string
                    tailwind:
                      type: boolean
                    attackerSide:
                      type: object
                      properties:
                        isHelpingHand:
                          type: boolean
                        isTailwind:
                          type: boolean
                    defenderSide:
                      type: object
                      properties:
                        isReflect:
                          type: boolean
                        isLightScreen:
                          type: boolean
                        isAuroraVeil:
                          type: boolean
                        isFriendGuard:
                          type: boolean
      responses:
        '200':
          description: Damage calculation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engine:
                    type: string
                  engineVersion:
                    type: string
                  damageRolls:
                    type: array
                    items:
                      type: number
                  damageRange:
                    type: array
                    items:
                      type: number
                  damagePercentOfMaxHp:
                    type: array
                    items:
                      type: number
                  koChance:
                    type: object
                    properties:
                      guaranteed:
                        type: boolean
                      chance:
                        type: number
                      rolls:
                        type: string
                  description:
                    type: string
  /speed:
    post:
      operationId: calculateSpeed
      summary: Calculate one Pokemon's effective speed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pokemon:
                  type: object
                  description: Pokemon set.
                  properties:
                    species:
                      type: string
                    ability:
                      type: string
                    item:
                      type: string
                    status:
                      type: string
                    statPoints:
                      type: object
                      properties:
                        hp:
                          type: integer
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    alignment:
                      type: string
                    boosts:
                      type: object
                      properties:
                        spe:
                          type: integer
                    unburdenActive:
                      type: boolean
                field:
                  type: object
                  description: Field state for speed calculation.
                  properties:
                    weather:
                      type: string
                    terrain:
                      type: string
                    tailwind:
                      type: boolean
                    attackerSide:
                      type: object
                      properties:
                        isTailwind:
                          type: boolean
      responses:
        '200':
          description: Speed calculation result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    type: string
                  rawSpeed:
                    type: number
                  effectiveSpeed:
                    type: number
                  notes:
                    type: array
                    items:
                      type: string
  /compare-speed:
    post:
      operationId: compareSpeed
      summary: Compare two Pokemon speeds under current field conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - left
                - right
              properties:
                left:
                  type: object
                  description: First Pokemon set.
                  properties:
                    species:
                      type: string
                    ability:
                      type: string
                    item:
                      type: string
                    status:
                      type: string
                    statPoints:
                      type: object
                      properties:
                        hp:
                          type: integer
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    alignment:
                      type: string
                    boosts:
                      type: object
                      properties:
                        spe:
                          type: integer
                    unburdenActive:
                      type: boolean
                right:
                  type: object
                  description: Second Pokemon set.
                  properties:
                    species:
                      type: string
                    ability:
                      type: string
                    item:
                      type: string
                    status:
                      type: string
                    statPoints:
                      type: object
                      properties:
                        hp:
                          type: integer
                        atk:
                          type: integer
                        def:
                          type: integer
                        spa:
                          type: integer
                        spd:
                          type: integer
                        spe:
                          type: integer
                    alignment:
                      type: string
                    boosts:
                      type: object
                      properties:
                        spe:
                          type: integer
                    unburdenActive:
                      type: boolean
                field:
                  type: object
                  description: Field state for speed comparison.
                  properties:
                    weather:
                      type: string
                    terrain:
                      type: string
                    tailwind:
                      type: boolean
                    attackerSide:
                      type: object
                      properties:
                        isTailwind:
                          type: boolean
      responses:
        '200':
          description: Speed comparison result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  left:
                    type: object
                    properties:
                      species:
                        type: string
                      rawSpeed:
                        type: number
                      effectiveSpeed:
                        type: number
                      notes:
                        type: array
                        items:
                          type: string
                  right:
                    type: object
                    properties:
                      species:
                        type: string
                      rawSpeed:
                        type: number
                      effectiveSpeed:
                        type: number
                      notes:
                        type: array
                        items:
                          type: string
                  faster:
                    type: string
