openapi: 3.0.3
info:
  title: Pokemon Champions Calculator API
  version: 1.0.0
  description: Calculator API for Pokemon Champions damage, speed, and speed comparison.
servers:
  - url: https://pkm-calculator-loyang-s-projects.vercel.app
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the calculator API is available.
      responses:
        '200':
          description: Calculator service status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
  /damage:
    post:
      operationId: calculateDamage
      summary: Calculate Pokemon Champions damage rolls and KO chance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attacker
                - defender
                - move
              properties:
                attacker:
                  type: object
                  description: Attacking Pokemon set. Include species, ability, item, statPoints, alignment, boosts, status, currentHp, or currentHpPercent when relevant.
                  additionalProperties: true
                defender:
                  type: object
                  description: Defending Pokemon set. Include species, ability, item, statPoints, alignment, boosts, status, currentHp, or currentHpPercent when relevant.
                  additionalProperties: true
                move:
                  type: object
                  description: Move input. Include name, isCrit, includeCritical, critStage, alwaysCrit, hits, useZ, or accuracy when relevant.
                  additionalProperties: true
                field:
                  type: object
                  description: Battle field state. Include weather, terrain, gameType, attackerSide, defenderSide, tailwind, screens, or other relevant field flags.
                  additionalProperties: true
      responses:
        '200':
          description: Damage calculation result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /speed:
    post:
      operationId: calculateSpeed
      summary: Calculate one Pokemon's effective speed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pokemon:
                  type: object
                  description: Pokemon set. Include species, statPoints, alignment, boosts, ability, item, status, or unburdenActive when relevant.
                  additionalProperties: true
                field:
                  type: object
                  description: Field state for speed calculation.
                  additionalProperties: true
              additionalProperties: true
      responses:
        '200':
          description: Speed calculation result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /compare-speed:
    post:
      operationId: compareSpeed
      summary: Compare two Pokemon speeds under current field conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - left
                - right
              properties:
                left:
                  type: object
                  description: First Pokemon set.
                  additionalProperties: true
                right:
                  type: object
                  description: Second Pokemon set.
                  additionalProperties: true
                field:
                  type: object
                  description: Field state for speed comparison.
                  additionalProperties: true
      responses:
        '200':
          description: Speed comparison result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
